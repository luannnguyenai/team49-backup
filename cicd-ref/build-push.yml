name: Build & Push to ECR

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_BACKEND_REPO: a20-app-backend
  ECR_FRONTEND_REPO: a20-app-frontend
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: build-push-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    name: Build Backend
    runs-on: [self-hosted, phoenix-runner-02]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ env.COMMIT_SHA }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=local,src=/tmp/buildx-cache-backend
          cache-to: type=local,dest=/tmp/buildx-cache-backend-new,mode=max

      - name: Rotate backend cache
        run: |
          rm -rf /tmp/buildx-cache-backend
          mv /tmp/buildx-cache-backend-new /tmp/buildx-cache-backend 2>/dev/null || true

  build-frontend:
    name: Build Frontend
    runs-on: [self-hosted, phoenix-runner-02]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: src/frontend
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPO }}:${{ env.COMMIT_SHA }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPO }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=local,src=/tmp/buildx-cache-frontend
          cache-to: type=local,dest=/tmp/buildx-cache-frontend-new,mode=max

      - name: Rotate frontend cache
        run: |
          rm -rf /tmp/buildx-cache-frontend
          mv /tmp/buildx-cache-frontend-new /tmp/buildx-cache-frontend 2>/dev/null || true
