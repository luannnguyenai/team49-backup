name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        default: "both"
        type: choice
        options: [both, frontend, backend]
  workflow_run:
    workflows: ["Build & Push to ECR"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  ECS_CLUSTER: a20-app-cluster
  BACKEND_SERVICE: a20-backend-service
  FRONTEND_SERVICE: a20-frontend-service

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: [self-hosted, phoenix-runner-02]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend service
        if: >
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'backend'))
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.BACKEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --no-cli-pager \
            --output text \
            --query 'service.deployments[0].status'
          echo "Backend deployment triggered"

      - name: Deploy frontend service
        if: >
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'frontend'))
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.FRONTEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} \
            --no-cli-pager \
            --output text \
            --query 'service.deployments[0].status'
          echo "Frontend deployment triggered"

      - name: Wait for frontend to stabilize
        if: >
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'frontend'))
        run: |
          echo "Waiting for frontend service (timeout: 15 min, max 3 retries)..."
          TIMEOUT=900
          INTERVAL=15
          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            elapsed=0
            stable=false
            while [ $elapsed -lt $TIMEOUT ]; do
              read running desired pending <<< $(aws ecs describe-services \
                --cluster ${{ env.ECS_CLUSTER }} \
                --services ${{ env.FRONTEND_SERVICE }} \
                --region ${{ env.AWS_REGION }} \
                --query 'services[0].[runningCount,desiredCount,pendingCount]' \
                --output text)
              echo "  [$elapsed s] running=$running desired=$desired pending=$pending"
              if [ "$running" -ge "$desired" ] && [ "$pending" -eq 0 ] && [ "$desired" -gt 0 ]; then
                stable=true
                break
              fi
              sleep $INTERVAL
              elapsed=$((elapsed + INTERVAL))
            done
            if $stable; then
              echo "Frontend stable"
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "Frontend failed to stabilize after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Attempt $attempt timed out, retrying..."
          done

      - name: Wait for backend to stabilize
        if: >
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'backend'))
        run: |
          echo "Waiting for backend service (timeout: 15 min, max 3 retries)..."
          TIMEOUT=900
          INTERVAL=15
          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES..."
            elapsed=0
            stable=false
            while [ $elapsed -lt $TIMEOUT ]; do
              read running desired pending <<< $(aws ecs describe-services \
                --cluster ${{ env.ECS_CLUSTER }} \
                --services ${{ env.BACKEND_SERVICE }} \
                --region ${{ env.AWS_REGION }} \
                --query 'services[0].[runningCount,desiredCount,pendingCount]' \
                --output text)
              echo "  [$elapsed s] running=$running desired=$desired pending=$pending"
              if [ "$running" -ge "$desired" ] && [ "$pending" -eq 0 ] && [ "$desired" -gt 0 ]; then
                stable=true
                break
              fi
              sleep $INTERVAL
              elapsed=$((elapsed + INTERVAL))
            done
            if $stable; then
              echo "Backend stable"
              break
            fi
            if [ "$attempt" -eq "$MAX_RETRIES" ]; then
              echo "Backend failed to stabilize after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Attempt $attempt timed out, retrying..."
          done

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Deployment successful"
            echo "Cluster: ${{ env.ECS_CLUSTER }}"
            echo "Monitor: https://ap-southeast-1.console.aws.amazon.com/ecs/v2/clusters/${{ env.ECS_CLUSTER }}/services"
          else
            echo "Deployment failed - check logs above"
          fi
