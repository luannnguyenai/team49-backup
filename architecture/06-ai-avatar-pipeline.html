<script>
  let s = 1;
  const sc = document.getElementById('sc');
  const zv = document.getElementById('zv');
  function zoom(d) { s = Math.min(2, Math.max(0.3, s + d)); apply(); }
  function reset() { s = 1; apply(); }
  function fit() {
    const w = document.getElementById('wrap');
    s = Math.min((w.clientWidth - 64) / 1400, (w.clientHeight - 32) / 700, 1);
    apply();
  }
  function apply() { sc.style.transform = `scale(${s})`; zv.textContent = Math.round(s * 100) + '%'; }
  window.addEventListener('load', () => setTimeout(fit, 80));
  document.addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') zoom(+0.1);
    if (e.key === '-') zoom(-0.1);
    if (e.key === '0') reset();
    if (e.key === 'f') fit();
  });
</script>
