  <rect width="1400" height="920" fill="#FAFAFA"/>

  <!-- PHASE 1: GOAL & TOPIC DISCOVERY -->
  <rect x="20" y="38" width="1360" height="226" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="40" y="58" font-size="11" font-weight="700" fill="#1E40AF">PHASE 1 — GOAL &amp; TOPIC DISCOVERY</text>

  <!-- Step 1 -->
  <rect x="40" y="68" width="300" height="176" rx="10" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="56" y="88" font-size="8.5" font-weight="700" fill="#93C5FD">STEP 1</text>
  <text x="190" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Select Learning Goals</text>
  <line x1="56" y1="118" x2="324" y2="118" stroke="#EFF6FF" stroke-width="1"/>
  <text x="190" y="136" text-anchor="middle" font-size="9" fill="#3B82F6">POST /api/onboarding/goals</text>
  <text x="190" y="154" text-anchor="middle" font-size="8.5" fill="#6B7280">Input:  goal_ids = ["nlp"]</text>
  <text x="190" y="170" text-anchor="middle" font-size="8.5" fill="#6B7280">Output: course_ids = ["cs224n"]</text>
  <text x="190" y="190" text-anchor="middle" font-size="8.5" fill="#6B7280">Creates UserOnboardingProgress</text>
  <rect x="128" y="206" width="124" height="24" rx="5" fill="#DBEAFE" stroke="none"/>
  <text x="190" y="222" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">&#x2705; test_step1_set_goals</text>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="156" x2="366" y2="156" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->

  <text x="382" y="88" font-size="8.5" font-weight="700" fill="#93C5FD">STEP 2</text>
  <text x="516" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Get Available Topics</text>
  <line x1="382" y1="118" x2="650" y2="118" stroke="#EFF6FF" stroke-width="1"/>
  <text x="516" y="136" text-anchor="middle" font-size="9" fill="#3B82F6">GET /api/onboarding/topics?goal=nlp</text>
  <text x="516" y="154" text-anchor="middle" font-size="8.5" fill="#6B7280">Hierarchical output:</text>
  <text x="516" y="170" text-anchor="middle" font-size="8.5" fill="#6B7280">courses &#x2192; sections &#x2192; units</text>
  <text x="516" y="186" text-anchor="middle" font-size="8.5" fill="#6B7280">unit: {id, title, canonical_unit_id}</text>
  <rect x="454" y="206" width="124" height="24" rx="5" fill="#DBEAFE" stroke="none"/>
  <text x="516" y="222" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">&#x2705; test_step2_get_topics</text>

  <!-- Arrow 2→3 -->
  <line x1="666" y1="156" x2="692" y2="156" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="692" y="68" width="300" height="176" rx="10" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="708" y="88" font-size="8.5" font-weight="700" fill="#93C5FD">STEP 3</text>
  <text x="842" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Mark Known Topics</text>
  <text x="842" y="117" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">(Optional)</text>
  <line x1="708" y1="124" x2="976" y2="124" stroke="#EFF6FF" stroke-width="1"/>
  <text x="842" y="142" text-anchor="middle" font-size="9" fill="#3B82F6">POST /onboarding/known-topics</text>
  <text x="842" y="160" text-anchor="middle" font-size="8.5" fill="#6B7280">Input:  topic_unit_ids = [uuid1...]</text>
  <text x="842" y="176" text-anchor="middle" font-size="8.5" fill="#6B7280">Effect: skip assessment for these</text>
  <text x="842" y="192" text-anchor="middle" font-size="8.5" fill="#6B7280">Output: marked_as_known = [...]</text>
  <rect x="780" y="206" width="124" height="24" rx="5" fill="#DBEAFE" stroke="none"/>
  <text x="842" y="222" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">&#x2705; test_step3_known_topics</text>

  <!-- Arrow 3→4 -->
  <line x1="992" y1="156" x2="1018" y2="156" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="1018" y="68" width="342" height="176" rx="10" fill="white" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="1034" y="88" font-size="8.5" font-weight="700" fill="#93C5FD">STEP 4</text>
  <text x="1189" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Set Experience Level</text>
  <line x1="1034" y1="118" x2="1344" y2="118" stroke="#EFF6FF" stroke-width="1"/>
  <text x="1189" y="136" text-anchor="middle" font-size="9" fill="#3B82F6">POST /onboarding/experience-level</text>
  <text x="1189" y="154" text-anchor="middle" font-size="8.5" fill="#6B7280">Input: "beginner" | "intermediate"</text>
  <text x="1189" y="170" text-anchor="middle" font-size="8.5" fill="#6B7280">       | "advanced"</text>
  <text x="1189" y="186" text-anchor="middle" font-size="8.5" fill="#6B7280">Stored in UserOnboardingProgress</text>
  <rect x="1127" y="206" width="124" height="24" rx="5" fill="#DBEAFE" stroke="none"/>
  <text x="1189" y="222" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">&#x2705; test_step4_experience</text>

  <!-- Phase 1 → Phase 2 arrow -->
  <line x1="700" y1="264" x2="700" y2="294" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PHASE 2: PLACEMENT ASSESSMENT -->
  <rect x="20" y="294" width="1360" height="222" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="40" y="314" font-size="11" font-weight="700" fill="#92400E">PHASE 2 — PLACEMENT ASSESSMENT</text>

  <!-- Step 5 -->
  <rect x="40" y="324" width="440" height="172" rx="10" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="56" y="344" font-size="8.5" font-weight="700" fill="#FCD34D">STEP 5</text>
  <text x="260" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Start Assessment</text>
  <line x1="56" y1="374" x2="464" y2="374" stroke="#FFFBEB" stroke-width="1"/>
  <text x="260" y="392" text-anchor="middle" font-size="9" fill="#D97706">POST /placement-assessment/start</text>
  <text x="260" y="408" text-anchor="middle" font-size="8.5" fill="#6B7280">5 items per topic  (1-2-2 distribution)</text>
  <!-- bucketing mini visual -->
  <rect x="80" y="416" width="80" height="46" rx="5" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="120" y="432" text-anchor="middle" font-size="8" font-weight="700" fill="#065F46">EASY &#xD7;1</text>
  <text x="120" y="446" text-anchor="middle" font-size="7.5" fill="#6B7280">diff &#x2264; -0.5</text>
  <text x="120" y="458" text-anchor="middle" font-size="7.5" fill="#6B7280">1 item</text>
  <rect x="178" y="416" width="80" height="46" rx="5" fill="#FEF9C3" stroke="#FDE047" stroke-width="1"/>
  <text x="218" y="432" text-anchor="middle" font-size="8" font-weight="700" fill="#713F12">MED &#xD7;2</text>
  <text x="218" y="446" text-anchor="middle" font-size="7.5" fill="#6B7280">-0.5 &lt; d &#x2264; 0.5</text>
  <text x="218" y="458" text-anchor="middle" font-size="7.5" fill="#6B7280">2 items</text>
  <rect x="276" y="416" width="80" height="46" rx="5" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="316" y="432" text-anchor="middle" font-size="8" font-weight="700" fill="#7F1D1D">HARD &#xD7;2</text>
  <text x="316" y="446" text-anchor="middle" font-size="7.5" fill="#6B7280">diff &gt; 0.5</text>
  <text x="316" y="458" text-anchor="middle" font-size="7.5" fill="#6B7280">2 items</text>
  <text x="260" y="480" text-anchor="middle" font-size="8" fill="#6B7280">Output: session_id + questions[]</text>
  <rect x="198" y="488" width="124" height="20" rx="5" fill="#FEF3C7" stroke="none"/>
  <text x="260" y="501" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">&#x2705; test_step5_start_placement</text>

  <!-- Arrow 5→6 -->
  <line x1="480" y1="410" x2="510" y2="410" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6 -->
  <rect x="510" y="324" width="320" height="172" rx="10" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="526" y="344" font-size="8.5" font-weight="700" fill="#FCD34D">STEP 6</text>
  <text x="670" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Answer Questions</text>
  <line x1="526" y1="374" x2="814" y2="374" stroke="#FFFBEB" stroke-width="1"/>
  <text x="670" y="394" text-anchor="middle" font-size="9" fill="#D97706">User selects A / B / C / D</text>
  <text x="670" y="412" text-anchor="middle" font-size="8.5" fill="#6B7280">10 questions total (5 per topic)</text>
  <!-- answer options visual -->
  <rect x="556" y="424" width="36" height="28" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="574" y="442" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">A</text>
  <rect x="602" y="424" width="36" height="28" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="620" y="442" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">B</text>
  <rect x="648" y="424" width="36" height="28" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="666" y="442" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">C</text>
  <rect x="694" y="424" width="36" height="28" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="712" y="442" text-anchor="middle" font-size="10" font-weight="700" fill="#1E40AF">D</text>
  <text x="670" y="470" text-anchor="middle" font-size="8.5" fill="#6B7280">Frontend stores in form state</text>
  <text x="670" y="486" text-anchor="middle" font-size="8.5" fill="#6B7280">No API call at this step</text>
  <rect x="608" y="488" width="124" height="20" rx="5" fill="#FEF3C7" stroke="none"/>
  <text x="670" y="501" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">Local state only</text>

  <!-- Arrow 6→7 -->
  <line x1="830" y1="410" x2="860" y2="410" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 7 -->
  <rect x="860" y="324" width="500" height="172" rx="10" fill="white" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="876" y="344" font-size="8.5" font-weight="700" fill="#FCD34D">STEP 7</text>
  <text x="1110" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Submit Assessment Answers</text>
  <line x1="876" y1="374" x2="1344" y2="374" stroke="#FFFBEB" stroke-width="1"/>
  <text x="1110" y="392" text-anchor="middle" font-size="9" fill="#D97706">POST /placement-assessment/submit</text>
  <text x="1110" y="410" text-anchor="middle" font-size="8.5" fill="#6B7280">Scoring: correct / total &#xD7; 100</text>
  <rect x="876" y="418" width="460" height="52" rx="7" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="946" y="436" font-size="8.5" fill="#92400E" font-weight="700">score &#x2265; 70%</text>
  <text x="946" y="450" font-size="8.5" fill="#16A34A">&#x2192; SKIP &#x2705;</text>
  <text x="946" y="463" font-size="8" fill="#6B7280">auto-approved</text>
  <text x="1096" y="436" font-size="8.5" fill="#92400E" font-weight="700">50% &#x2264; score &lt; 70%</text>
  <text x="1096" y="450" font-size="8.5" fill="#D97706">&#x2192; REVIEW &#x26A0;&#xFE0F;</text>
  <text x="1096" y="463" font-size="8" fill="#6B7280">user can choose</text>
  <text x="1256" y="436" font-size="8.5" fill="#92400E" font-weight="700">score &lt; 50%</text>
  <text x="1256" y="450" font-size="8.5" fill="#DC2626">&#x2192; RELEARN &#x274C;</text>
  <text x="1256" y="463" font-size="8" fill="#6B7280">must relearn</text>
  <rect x="1048" y="488" width="124" height="20" rx="5" fill="#FEF3C7" stroke="none"/>
  <text x="1110" y="501" text-anchor="middle" font-size="8" font-weight="600" fill="#92400E">&#x2705; test_step6_submit</text>

  <!-- Phase 2 → Phase 3 arrow -->
  <line x1="700" y1="516" x2="700" y2="546" stroke="#6B7280" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PHASE 3: RESULTS & DECISIONS -->
  <rect x="20" y="546" width="1360" height="354" rx="14" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="40" y="566" font-size="11" font-weight="700" fill="#14532D">PHASE 3 — RESULTS &amp; DECISIONS</text>

  <!-- Step 8: View Results -->
  <rect x="460" y="576" width="480" height="100" rx="10" fill="white" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="476" y="596" font-size="8.5" font-weight="700" fill="#86EFAC">STEP 8</text>
  <text x="700" y="614" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">View Placement Results</text>
  <line x1="476" y1="622" x2="924" y2="622" stroke="#F0FDF4" stroke-width="1"/>
  <text x="700" y="640" text-anchor="middle" font-size="9" fill="#059669">GET /placement-assessment/results</text>
  <text x="700" y="658" text-anchor="middle" font-size="8.5" fill="#6B7280">Returns: topic_decisions[] with score_pct + decision + user_choice</text>
  <text x="700" y="672" text-anchor="middle" font-size="8.5" fill="#6B7280">has_placement: true</text>

  <!-- Branch arrows from Step 8 -->
  <line x1="510" y1="676" x2="240" y2="726" stroke="#16A34A" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <line x1="700" y1="676" x2="700" y2="720" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrYellow)"/>
  <line x1="890" y1="676" x2="1160" y2="726" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrRed)"/>

  <!-- Branch labels -->
  <text x="350"  y="710" text-anchor="middle" font-size="9" font-weight="700" fill="#16A34A">score &#x2265; 70%</text>
  <text x="700"  y="710" text-anchor="middle" font-size="9" font-weight="700" fill="#D97706">50% &#x2264; score &lt; 70%</text>
  <text x="1060" y="710" text-anchor="middle" font-size="9" font-weight="700" fill="#DC2626">score &lt; 50%</text>

  <!-- SKIP card -->
  <rect x="60" y="726" width="358" height="144" rx="10" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="239" y="748" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">SKIP &#x2705;</text>
  <line x1="76" y1="756" x2="402" y2="756" stroke="#BBF7D0" stroke-width="1"/>
  <text x="239" y="774" text-anchor="middle" font-size="9" fill="#14532D">User can skip this topic</text>
  <text x="239" y="791" text-anchor="middle" font-size="8.5" fill="#6B7280">Auto-approved, no override</text>
  <text x="239" y="808" text-anchor="middle" font-size="8.5" fill="#6B7280">decision = "skip"</text>
  <text x="239" y="825" text-anchor="middle" font-size="8.5" fill="#6B7280">user_choice = null</text>
  <rect x="147" y="854" width="184" height="20" rx="5" fill="white" stroke="#86EFAC" stroke-width="1"/>
  <text x="239" y="867" text-anchor="middle" font-size="8" fill="#16A34A">&#x2705; No further action needed</text>

  <!-- REVIEW card -->
  <rect x="460" y="720" width="480" height="160" rx="10" fill="#FEF9C3" stroke="#FDE047" stroke-width="1.5"/>
  <text x="700" y="744" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">REVIEW &#x26A0;&#xFE0F;</text>
  <line x1="476" y1="752" x2="924" y2="752" stroke="#FEF08A" stroke-width="1"/>
  <text x="700" y="771" text-anchor="middle" font-size="9" fill="#78350F">User can choose to override</text>
  <text x="700" y="787" text-anchor="middle" font-size="8.5" fill="#6B7280">decision = "review"  user_choice = null (pending)</text>
  <!-- Step 9 inside REVIEW -->
  <rect x="478" y="796" width="444" height="72" rx="8" fill="white" stroke="#FDE047" stroke-width="1.2"/>
  <text x="494" y="812" font-size="8" font-weight="700" fill="#FCD34D">STEP 9 (optional)</text>
  <text x="700" y="828" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">User Overrides Decision</text>
  <text x="700" y="844" text-anchor="middle" font-size="8.5" fill="#6B7280">PATCH /placement-assessment/topic-decision</text>
  <text x="700" y="858" text-anchor="middle" font-size="8.5" fill="#6B7280">user_choice: "skip" | "relearn"</text>

  <!-- Sub-arrows inside REVIEW -->
  <line x1="600" y1="868" x2="560" y2="882" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrGreen)"/>
  <text x="534" y="892" font-size="8" fill="#16A34A">&#x2192; skip</text>
  <line x1="800" y1="868" x2="840" y2="882" stroke="#DC2626" stroke-width="1.2" marker-end="url(#arrRed)"/>
  <text x="846" y="892" font-size="8" fill="#DC2626">&#x2192; relearn</text>
  <rect x="618" y="876" width="164" height="14" rx="4" fill="#FEF3C7" stroke="none"/>

  <script>
    let scale = 1;
    const inner = document.getElementById('diagram-inner');
    const label = document.getElementById('zoom-label');

    function zoom(delta) {
      scale = Math.min(3, Math.max(0.2, scale + delta));
      inner.style.transform = `scale(${scale})`;
      label.textContent = Math.round(scale * 100) + '%';
    }

    function reset() {
      scale = 1;
      inner.style.transform = 'scale(1)';
      label.textContent = '100%';
    }

    function fit() {
      const wrapper = document.getElementById('wrapper');
      const sw = wrapper.clientWidth - 48;
      const sh = wrapper.clientHeight - 48;
      const dw = 1400, dh = 920;
      scale = Math.min(sw / dw, sh / dh, 1);
      inner.style.transform = `scale(${scale})`;
      label.textContent = Math.round(scale * 100) + '%';
    }

    document.addEventListener('keydown', e => {
      if (e.key === '+' || e.key === '=') zoom(0.15);
      else if (e.key === '-') zoom(-0.15);
      else if (e.key === '0') reset();
      else if (e.key === 'f' || e.key === 'F') fit();
    });

    setTimeout(fit, 80);
  </script>
