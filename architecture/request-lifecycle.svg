<svg width="1200" height="740" viewBox="0 0 1200 740" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#9CA3AF"/></marker>
  </defs>
  <rect width="1200" height="740" fill="#F0F2F5"/>
  <text x="600" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Request Lifecycle — A20-App-049</text>

  <!-- Flow 1 header -->
  <rect x="20" y="38" width="560" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <text x="300" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Flow 1: Page Load (SSR)</text>

  <!-- Flow 2 header -->
  <rect x="620" y="38" width="560" height="28" rx="6" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1"/>
  <text x="900" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="#5B2C6F">Flow 2: AI Tutor Chat (Agentic RAG + SSE)</text>

  <!-- Divider -->
  <line x1="600" y1="38" x2="600" y2="700" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Flow 1 Steps -->
  <!-- Step 1 -->
  <rect x="40" y="82" width="510" height="52" rx="7" fill="#DBEAFE" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="62" y="100" font-size="11" font-weight="700" fill="#1E3A8A">1  Browser</text>
  <text x="62" y="118" font-size="10" fill="#3B82F6">GET https://a20-app-049.io.vn/  HTTPS via CloudFront + ALB</text>
  <line x1="295" y1="134" x2="295" y2="150" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="40" y="150" width="510" height="52" rx="7" fill="#FEF3C7" stroke="#FF9900" stroke-width="1.2"/>
  <text x="62" y="168" font-size="11" font-weight="700" fill="#92400E">2  ALB routes request</text>
  <text x="62" y="186" font-size="10" fill="#B45309">/  target group Frontend  /api  target group Backend</text>
  <line x1="295" y1="202" x2="295" y2="218" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="40" y="218" width="510" height="52" rx="7" fill="#FEE0D0" stroke="#E7500A" stroke-width="1.2"/>
  <text x="62" y="236" font-size="11" font-weight="700" fill="#7B2A0A">3  Next.js SSR (ECS Fargate)</text>
  <text x="62" y="254" font-size="10" fill="#9A3412">Server-side fetch to FastAPI  GET /api/courses  RSC render</text>
  <line x1="295" y1="270" x2="295" y2="286" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="40" y="286" width="510" height="52" rx="7" fill="#BFDBFE" stroke="#1565C0" stroke-width="1.2"/>
  <text x="62" y="304" font-size="11" font-weight="700" fill="#1E40AF">4  FastAPI + PostgreSQL</text>
  <text x="62" y="322" font-size="10" fill="#1565C0">SELECT courses WHERE active=true  Redis cache check first</text>
  <line x1="295" y1="338" x2="295" y2="354" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="40" y="354" width="510" height="52" rx="7" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2"/>
  <text x="62" y="372" font-size="11" font-weight="700" fill="#14532D">5  HTML response delivered</text>
  <text x="62" y="390" font-size="10" fill="#166534">Rendered HTML  Browser  hydration  Next.js client bundle</text>

  <!-- Legend Flow 1 -->
  <rect x="40" y="422" width="510" height="52" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="295" y="440" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">Components</text>
  <rect x="56" y="448" width="70" height="14" rx="3" fill="#DBEAFE" stroke="#4A90D9" stroke-width="1"/>
  <text x="91" y="459" text-anchor="middle" font-size="8" fill="#1E3A8A">Browser</text>
  <rect x="136" y="448" width="70" height="14" rx="3" fill="#FEF3C7" stroke="#FF9900" stroke-width="1"/>
  <text x="171" y="459" text-anchor="middle" font-size="8" fill="#7D3C00">ALB / CDN</text>
  <rect x="216" y="448" width="70" height="14" rx="3" fill="#FEE0D0" stroke="#E7500A" stroke-width="1"/>
  <text x="251" y="459" text-anchor="middle" font-size="8" fill="#7B2A0A">ECS Fargate</text>
  <rect x="296" y="448" width="70" height="14" rx="3" fill="#BFDBFE" stroke="#1565C0" stroke-width="1"/>
  <text x="331" y="459" text-anchor="middle" font-size="8" fill="#1E40AF">Database</text>

  <!-- Flow 2 Steps -->
  <!-- Step 1 -->
  <rect x="640" y="82" width="540" height="52" rx="7" fill="#DBEAFE" stroke="#4A90D9" stroke-width="1.2"/>
  <text x="662" y="100" font-size="11" font-weight="700" fill="#1E3A8A">1  Browser sends chat message</text>
  <text x="662" y="118" font-size="10" fill="#3B82F6">POST /api/agent/message  thread_id  message  unit_id</text>
  <line x1="910" y1="134" x2="910" y2="150" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="640" y="150" width="540" height="52" rx="7" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
  <text x="662" y="168" font-size="11" font-weight="700" fill="#7F1D1D">2  Guardrail Router</text>
  <text x="662" y="186" font-size="10" fill="#B91C1C">PII strip  Qwen3.5-0.8B classify  SAFE  topic  ALLOW</text>
  <line x1="910" y1="202" x2="910" y2="218" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="640" y="218" width="540" height="52" rx="7" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="662" y="236" font-size="11" font-weight="700" fill="#5B21B6">3  LangGraph Agent invoked</text>
  <text x="662" y="254" font-size="10" fill="#6D28D9">load thread state  vector_search(embed)  ReAct loop</text>
  <line x1="910" y1="270" x2="910" y2="286" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4 -->
  <rect x="640" y="286" width="540" height="52" rx="7" fill="#BFDBFE" stroke="#1565C0" stroke-width="1.2"/>
  <text x="662" y="304" font-size="11" font-weight="700" fill="#1E40AF">4  RAG + Rerank</text>
  <text x="662" y="322" font-size="10" fill="#1565C0">pgvector top-k  rerank  evidence_policy  citation grounding</text>
  <line x1="910" y1="338" x2="910" y2="354" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5 -->
  <rect x="640" y="354" width="540" height="52" rx="7" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="662" y="372" font-size="11" font-weight="700" fill="#5B21B6">5  vLLM inference (Qwen3.5-4B LoRA)</text>
  <text x="662" y="390" font-size="10" fill="#6D28D9">generate(evidence, question)  streaming  token-by-token</text>
  <line x1="910" y1="406" x2="910" y2="422" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6 -->
  <rect x="640" y="422" width="540" height="52" rx="7" fill="#EAFAF1" stroke="#27AE60" stroke-width="1.2"/>
  <text x="662" y="440" font-size="11" font-weight="700" fill="#1A6E3A">6  SSE stream + Langfuse trace</text>
  <text x="662" y="458" font-size="10" fill="#16A34A">text/event-stream  Browser  trace_span(input, output, latency)</text>

  <!-- Timing notes -->
  <rect x="640" y="490" width="540" height="68" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="910" y="508" text-anchor="middle" font-size="9" font-weight="700" fill="#374151">Typical Latency Budget</text>
  <text x="662" y="524" font-size="9" fill="#6B7280">Guardrail:  ~80 ms   RAG retrieval:  ~120 ms</text>
  <text x="662" y="540" font-size="9" fill="#6B7280">vLLM first token (TTFT):  ~400 ms   Total e2e:  ~800 ms</text>
  <text x="662" y="556" font-size="9" fill="#6B7280">Thread state saved to PostgreSQL (agent_graph_runs)</text>

  <!-- Footer -->
  <text x="600" y="690" text-anchor="middle" font-size="9" fill="#9CA3AF">A20-App-049  AWS ECS Fargate  FastAPI + Next.js 14  LangGraph Agentic RAG</text>
</svg>
