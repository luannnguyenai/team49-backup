<svg width="900" height="880" viewBox="0 0 900 880" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,Segoe UI,Helvetica,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#9CA3AF"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#16A34A"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#DC2626"/></marker>
  </defs>
  <rect width="900" height="880" fill="#F0F2F5"/>
  <text x="450" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Agentic RAG Pipeline — A20-App-049</text>

  <!-- User Message -->
  <rect x="300" y="38" width="300" height="50" rx="8" fill="#DBEAFE" stroke="#4A90D9" stroke-width="1.5"/>
  <text x="450" y="59" text-anchor="middle" font-size="12" font-weight="700" fill="#1E3A8A">User Message</text>
  <text x="450" y="77" text-anchor="middle" font-size="10" fill="#3B82F6">Free-text query from learner</text>
  <line x1="450" y1="88" x2="450" y2="106" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PII Sanitizer -->
  <rect x="300" y="106" width="300" height="50" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="450" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">PII Sanitizer</text>
  <text x="450" y="145" text-anchor="middle" font-size="10" fill="#B91C1C">Strip email / phone / CCCD before LLM</text>
  <line x1="450" y1="156" x2="450" y2="174" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Guardrail Router -->
  <rect x="260" y="174" width="380" height="54" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="450" y="197" text-anchor="middle" font-size="12" font-weight="700" fill="#7F1D1D">Guardrail Router</text>
  <text x="450" y="215" text-anchor="middle" font-size="10" fill="#B91C1C">Qwen3.5-0.8B LoRA  SAFE / HARMFUL / AMBIGUOUS</text>

  <!-- SAFE branch -->
  <line x1="310" y1="228" x2="200" y2="276" stroke="#16A34A" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="222" y="262" font-size="10" font-weight="700" fill="#16A34A">SAFE</text>
  <!-- HARMFUL branch -->
  <line x1="590" y1="228" x2="700" y2="276" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrR)"/>
  <text x="628" y="262" font-size="10" font-weight="700" fill="#DC2626">HARMFUL</text>

  <!-- Smart Router -->
  <rect x="88" y="276" width="224" height="50" rx="8" fill="#FEF3C7" stroke="#FF9900" stroke-width="1.5"/>
  <text x="200" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">Smart Router</text>
  <text x="200" y="315" text-anchor="middle" font-size="10" fill="#B45309">SIMPLE or COMPLEX?</text>

  <!-- Refuse -->
  <rect x="588" y="276" width="210" height="50" rx="8" fill="#FEF2F2" stroke="#F87171" stroke-width="1.5"/>
  <text x="693" y="297" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Safety Refuse</text>
  <text x="693" y="315" text-anchor="middle" font-size="10" fill="#991B1B">Refusal  No LLM inference</text>

