  <line x1="265" y1="326" x2="370" y2="374" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="284" y="364" font-size="9" font-weight="700" fill="#5B21B6">COMPLEX</text>

