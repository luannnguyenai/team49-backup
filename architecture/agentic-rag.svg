  <text x="440" y="713" text-anchor="middle" font-size="10" fill="#16A34A">Token-by-token to Browser  Langfuse trace logged</text>

  <!-- Langfuse box -->
  <rect x="720" y="598" width="160" height="66" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="800" y="618" text-anchor="middle" font-size="11" font-weight="700" fill="#5B21B6">Langfuse</text>
  <text x="800" y="634" text-anchor="middle" font-size="9" fill="#6D28D9">Trace per turn</text>
  <text x="800" y="650" text-anchor="middle" font-size="9" fill="#6D28D9">input / output / latency</text>
  <line x1="720" y1="630" x2="680" y2="700" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

