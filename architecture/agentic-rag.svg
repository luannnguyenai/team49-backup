  <text x="128" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">Direct LLM</text>
  <text x="128" y="413" text-anchor="middle" font-size="10" fill="#B45309">Claude  No agent graph</text>

  <!-- LangGraph Agent -->
  <rect x="270" y="374" width="260" height="50" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="400" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">LangGraph Agent</text>
  <text x="400" y="413" text-anchor="middle" font-size="10" fill="#6D28D9">Agentic RAG  ReAct  Thread memory</text>

