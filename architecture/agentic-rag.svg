  <line x1="400" y1="424" x2="400" y2="466" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrG)"/>
  <line x1="460" y1="424" x2="600" y2="466" stroke="#16A34A" stroke-width="1.2" marker-end="url(#arrG)"/>

  <!-- Tool RAG -->
  <rect x="88" y="466" width="190" height="62" rx="8" fill="#F0FFF4" stroke="#27AE60" stroke-width="1.2"/>
  <text x="183" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#1A6E3A">RAG</text>
  <text x="183" y="504" text-anchor="middle" font-size="9" fill="#166534">pgvector</text>
  <text x="183" y="520" text-anchor="middle" font-size="9" fill="#166534">Transcript chunks</text>

