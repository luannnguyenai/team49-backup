  <text x="85" y="796" text-anchor="middle" font-size="8.5" fill="#7F1D1D">Safety / PII</text>
  <rect x="146" y="784" width="80" height="16" rx="3" fill="#FEF3C7" stroke="#FF9900" stroke-width="1"/>
  <text x="186" y="796" text-anchor="middle" font-size="8.5" fill="#7D3C00">Routing</text>
  <rect x="240" y="784" width="80" height="16" rx="3" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="280" y="796" text-anchor="middle" font-size="8.5" fill="#5B2C6F">AI Agent</text>
  <rect x="334" y="784" width="80" height="16" rx="3" fill="#F0FFF4" stroke="#27AE60" stroke-width="1"/>
  <text x="374" y="796" text-anchor="middle" font-size="8.5" fill="#1A6E3A">Tools</text>
  <rect x="428" y="784" width="90" height="16" rx="3" fill="#EAF4FB" stroke="#1565C0" stroke-width="1"/>
  <text x="473" y="796" text-anchor="middle" font-size="8.5" fill="#0D4080">Generation</text>
  <rect x="532" y="784" width="90" height="16" rx="3" fill="#EAFAF1" stroke="#27AE60" stroke-width="1"/>
  <text x="577" y="796" text-anchor="middle" font-size="8.5" fill="#1A6E3A">SSE Response</text>
  <rect x="636" y="784" width="80" height="16" rx="3" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/>
  <text x="676" y="796" text-anchor="middle" font-size="8.5" fill="#5B2C6F">Observability</text>
