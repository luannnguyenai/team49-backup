  <line x1="150" y1="326" x2="120" y2="374" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="96" y="365" font-size="9" font-weight="700" fill="#92400E">SIMPLE</text>
