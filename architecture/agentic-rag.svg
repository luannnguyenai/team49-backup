  <text x="400" y="504" text-anchor="middle" font-size="9" fill="#166534">Python exec</text>
  <text x="400" y="520" text-anchor="middle" font-size="9" fill="#166534">Math  Code</text>

  <!-- Tool Web Search -->
  <rect x="513" y="466" width="190" height="62" rx="8" fill="#F0FFF4" stroke="#27AE60" stroke-width="1.2"/>
  <text x="608" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#1A6E3A">Web Search</text>
  <text x="608" y="504" text-anchor="middle" font-size="9" fill="#166534">Semantic Scholar</text>
  <text x="608" y="520" text-anchor="middle" font-size="9" fill="#166534">External refs</text>

  <!-- Arrows to Answer Generator -->
  <line x1="183" y1="528" x2="340" y2="598" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="400" y1="528" x2="420" y2="598" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="608" y1="528" x2="500" y2="598" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Direct LLM to Answer Generator -->
  <line x1="128" y1="424" x2="300" y2="598" stroke="#9CA3AF" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Answer Generator -->
  <rect x="210" y="598" width="460" height="54" rx="8" fill="#EAF4FB" stroke="#1565C0" stroke-width="1.5"/>
  <text x="440" y="621" text-anchor="middle" font-size="12" font-weight="700" fill="#0D4080">Answer Generator</text>
  <text x="440" y="639" text-anchor="middle" font-size="10" fill="#1565C0">Qwen3.5-4B LoRA  Citation grounding  No hallucination policy</text>
  <line x1="440" y1="652" x2="440" y2="672" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#arr)"/>

