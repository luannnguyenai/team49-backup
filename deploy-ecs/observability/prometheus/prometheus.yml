global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: a20-app-049
    env: prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend /metrics scrape is deferred. Backend ECS service has no Cloud Map
  # registration yet, and ALB does not route /metrics. To enable: register
  # backend in the obs namespace OR add an internal ALB rule for /metrics.

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter.obs.a20-prod.internal:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter.obs.a20-prod.internal:9121"]
