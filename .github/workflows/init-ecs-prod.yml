name: Initialize ECS Production

on:
  workflow_run:
    workflows: ["Deploy ECS Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed_core:
        description: Import canonical content, product shell, and runtime lecture tables
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      run_sync_schema_v2:
        description: Backfill, validate, and parity-check Schema v2
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      run_seed_accounts:
        description: Upsert admin and demo accounts
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      smoke_after_init:
        description: Smoke test backend data and Grafana after initialization
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      canonical_bundle_version:
        description: Optional canonical bundle version/prefix leaf to fetch from S3
        required: false
        default: ""
      image_tag:
        description: Optional existing backend image tag to use
        required: false
        default: ""

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: init-production
  cancel-in-progress: false

jobs:
  init:
    name: Initialize Production Data
    runs-on: [self-hosted, phoenix-runner-02]
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      CANONICAL_BUNDLE_PREFIX: ${{ vars.CANONICAL_BUNDLE_PREFIX }}
      CANONICAL_BUNDLE_VERSION: ${{ vars.CANONICAL_BUNDLE_VERSION }}
      ECS_CLUSTER_NAME: ${{ vars.ECS_CLUSTER_NAME }}
      ECS_BACKEND_SERVICE_NAME: ${{ vars.ECS_BACKEND_SERVICE_NAME }}
      BACKEND_TASK_FAMILY: ${{ vars.BACKEND_TASK_FAMILY }}
      PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
      NEXT_PUBLIC_GRAFANA_HOST: ${{ vars.NEXT_PUBLIC_GRAFANA_HOST }}
      SMOKE_DB_ROUTE: ${{ vars.SMOKE_DB_ROUTE }}
      BACKEND_SECRET_ARN: ${{ secrets.BACKEND_SECRET_ARN }}
      TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}
      BACKEND_TASK_ROLE_ARN: ${{ secrets.BACKEND_TASK_ROLE_ARN }}
      PRIVATE_SUBNET_IDS: ${{ secrets.PRIVATE_SUBNET_IDS }}
      BACKEND_SECURITY_GROUP_ID: ${{ secrets.BACKEND_SECURITY_GROUP_ID }}
      RUN_TASK_TIMEOUT_SECONDS: "1800"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve workflow intent, backend image, and task families
        id: init
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_seed_core="${{ inputs.run_seed_core }}"
            run_sync_schema_v2="${{ inputs.run_sync_schema_v2 }}"
            run_seed_accounts="${{ inputs.run_seed_accounts }}"
            smoke_after_init="${{ inputs.smoke_after_init }}"
            requested_bundle_version="${{ inputs.canonical_bundle_version }}"
            requested_tag="${{ inputs.image_tag }}"
          else
            run_seed_core="true"
            run_sync_schema_v2="true"
            run_seed_accounts="true"
            smoke_after_init="true"
            requested_bundle_version=""
            requested_tag="${{ github.event.workflow_run.head_sha }}"
          fi

          if [ -n "$requested_tag" ]; then
            backend_image="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPOSITORY}:${requested_tag}"
            image_tag="$requested_tag"
          else
            service_task_definition_arn="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$ECS_BACKEND_SERVICE_NAME" \
              --query 'services[0].taskDefinition' \
              --output text)"

            backend_image="$(aws ecs describe-task-definition \
              --task-definition "$service_task_definition_arn" \
              --query 'taskDefinition.containerDefinitions[0].image' \
              --output text)"

            image_tag="${backend_image##*:}"
          fi

          bundle_version="${requested_bundle_version:-}"
          if [ -z "$bundle_version" ]; then
            bundle_version="${CANONICAL_BUNDLE_VERSION:-}"
          fi

          if [ "$run_seed_core" = "true" ] || [ "$run_sync_schema_v2" = "true" ]; then
            : "${AWS_S3_BUCKET:?AWS_S3_BUCKET is required when canonical bundle tasks run}"
            : "${CANONICAL_BUNDLE_PREFIX:?CANONICAL_BUNDLE_PREFIX is required when canonical bundle tasks run}"
            : "${bundle_version:?canonical bundle version is required when canonical bundle tasks run}"
            bundle_prefix="${CANONICAL_BUNDLE_PREFIX%/}/${bundle_version}/canonical"
            canonical_bundle_s3_uri="s3://${AWS_S3_BUCKET}/${bundle_prefix}"
            canonical_bundle_local_dir="/tmp/canonical-bundle"
            echo "canonical_bundle_version=${bundle_version}" >> "$GITHUB_OUTPUT"
            echo "CANONICAL_BUNDLE_S3_URI=${canonical_bundle_s3_uri}" >> "$GITHUB_ENV"
            echo "CANONICAL_BUNDLE_LOCAL_DIR=${canonical_bundle_local_dir}" >> "$GITHUB_ENV"
          fi

          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "run_seed_core=${run_seed_core}" >> "$GITHUB_OUTPUT"
          echo "run_sync_schema_v2=${run_sync_schema_v2}" >> "$GITHUB_OUTPUT"
          echo "run_seed_accounts=${run_seed_accounts}" >> "$GITHUB_OUTPUT"
          echo "smoke_after_init=${smoke_after_init}" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=${backend_image}" >> "$GITHUB_ENV"
          echo "SEED_CORE_TASK_FAMILY=${BACKEND_TASK_FAMILY}-seed-core" >> "$GITHUB_ENV"
          echo "SYNC_SCHEMA_V2_TASK_FAMILY=${BACKEND_TASK_FAMILY}-sync-schema-v2" >> "$GITHUB_ENV"
          echo "SEED_ACCOUNTS_TASK_FAMILY=${BACKEND_TASK_FAMILY}-seed-accounts" >> "$GITHUB_ENV"

      - name: Run seed core
        if: ${{ steps.init.outputs.run_seed_core == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="$BACKEND_IMAGE" \
          CANONICAL_BUNDLE_S3_URI="$CANONICAL_BUNDLE_S3_URI" \
          CANONICAL_BUNDLE_LOCAL_DIR="$CANONICAL_BUNDLE_LOCAL_DIR" \
          LOG_GROUP="/ecs/${SEED_CORE_TASK_FAMILY}" \
          bash cicd/scripts/render-taskdef.sh \
            cicd/taskdefs/backend-seed-core.json.tpl \
            /tmp/backend-seed-core.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/backend-seed-core.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          LOG_GROUP="/ecs/${SEED_CORE_TASK_FAMILY}" \
          bash cicd/scripts/run-ecs-task.sh "$task_definition_arn"

      - name: Run Schema v2 sync
        if: ${{ steps.init.outputs.run_sync_schema_v2 == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="$BACKEND_IMAGE" \
          CANONICAL_BUNDLE_S3_URI="$CANONICAL_BUNDLE_S3_URI" \
          CANONICAL_BUNDLE_LOCAL_DIR="$CANONICAL_BUNDLE_LOCAL_DIR" \
          LOG_GROUP="/ecs/${SYNC_SCHEMA_V2_TASK_FAMILY}" \
          bash cicd/scripts/render-taskdef.sh \
            cicd/taskdefs/backend-sync-schema-v2.json.tpl \
            /tmp/backend-sync-schema-v2.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/backend-sync-schema-v2.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          LOG_GROUP="/ecs/${SYNC_SCHEMA_V2_TASK_FAMILY}" \
          bash cicd/scripts/run-ecs-task.sh "$task_definition_arn"

      - name: Run seed accounts
        if: ${{ steps.init.outputs.run_seed_accounts == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="$BACKEND_IMAGE" \
          LOG_GROUP="/ecs/${SEED_ACCOUNTS_TASK_FAMILY}" \
          bash cicd/scripts/render-taskdef.sh \
            cicd/taskdefs/backend-seed-accounts.json.tpl \
            /tmp/backend-seed-accounts.json

          task_definition_arn="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/backend-seed-accounts.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          LOG_GROUP="/ecs/${SEED_ACCOUNTS_TASK_FAMILY}" \
          bash cicd/scripts/run-ecs-task.sh "$task_definition_arn"

      - name: Smoke initialized backend data
        if: ${{ steps.init.outputs.smoke_after_init == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash cicd/scripts/smoke-ecs.sh db
          if [ -n "${NEXT_PUBLIC_GRAFANA_HOST:-}" ]; then
            bash cicd/scripts/smoke-ecs.sh grafana
          fi
