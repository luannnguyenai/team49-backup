# =============================================================================
# CI — Path-aware validation for pushes and pull requests
# =============================================================================
# Backend checks run only for backend/runtime changes.
# Frontend checks run only for frontend changes.
# Workflow/deploy-doc changes get a lightweight repo config validation job.
# =============================================================================

name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  changes:
    name: "Detect changed areas"
    runs-on: [self-hosted, linux, aws, ec2]
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      repo_config: ${{ steps.filter.outputs.repo_config }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "src/**"
              - "tests/**"
              - "alembic/**"
              - "scripts/**"
              - "data/bootstrap/**"
              - "data/asset_manifest.json"
              - "requirements.txt"
              - "pyproject.toml"
              - "uv.lock"
              - "Dockerfile"
              - ".dockerignore"
            frontend:
              - "frontend/**"
            repo_config:
              - ".github/workflows/**"
              - "cicd/**"
              - "deploy-ecs/**"
              - ".gitignore"
              - "AGENTS.md"

  repo-config:
    name: "Repo config · Validate"
    runs-on: [self-hosted, linux, aws, ec2]
    needs: changes
    if: needs.changes.outputs.repo_config == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".github/workflows").glob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"parsed {path}")
          PY

      - name: Check deploy docs whitespace
        run: git diff --check -- deploy .github/workflows .dockerignore pyproject.toml

  backend:
    name: "Backend · Ruff + Pytest"
    runs-on: [self-hosted, linux, aws, ec2]
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_ai_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_ai_learning
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_test_secret_key_min_32_chars_long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/ scripts/

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --junitxml=reports/junit.xml \
            --cov=src \
            --cov-report=xml:reports/coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: reports/

  frontend:
    name: "Frontend · Type-check"
    runs-on: [self-hosted, linux, aws, ec2]
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://localhost:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type-check
        run: npm run type-check

  ci-status:
    name: "CI · Status"
    runs-on: [self-hosted, linux, aws, ec2]
    needs:
      - changes
      - repo-config
      - backend
      - frontend
    if: always()

    steps:
      - name: Check required CI jobs
        run: |
          backend="${{ needs.changes.outputs.backend }}"
          frontend="${{ needs.changes.outputs.frontend }}"
          repo_config="${{ needs.changes.outputs.repo_config }}"

          repo_result="${{ needs.repo-config.result }}"
          backend_result="${{ needs.backend.result }}"
          frontend_result="${{ needs.frontend.result }}"

          echo "backend changed: $backend -> $backend_result"
          echo "frontend changed: $frontend -> $frontend_result"
          echo "repo config changed: $repo_config -> $repo_result"

          if [ "$backend" = "true" ] && [ "$backend_result" != "success" ]; then
            exit 1
          fi

          if [ "$frontend" = "true" ] && [ "$frontend_result" != "success" ]; then
            exit 1
          fi

          if [ "$repo_config" = "true" ] && [ "$repo_result" != "success" ]; then
            exit 1
          fi

          echo "Selected CI checks passed."
