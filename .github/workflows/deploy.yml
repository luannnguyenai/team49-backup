# =============================================================================
# Legacy Deploy — Frozen
# =============================================================================
# The old Vercel/Railway/Supabase deployment path is intentionally disabled
# while production deployment moves to the AWS Terraform architecture.
#
# This workflow is manual-only and does not deploy anything. Keep CI in
# .github/workflows/ci.yml as the gate for pushes and pull requests.
# =============================================================================

name: Legacy Deploy (Frozen)

on:
  workflow_dispatch:

concurrency:
  group: legacy-deploy-frozen
  cancel-in-progress: false

jobs:
  frozen:
    name: "Legacy deploy is frozen"
    runs-on: ubuntu-latest

    steps:
      - name: Explain frozen legacy deploy path
        run: |
          echo "Legacy Vercel/Railway/Supabase deployment is disabled."
          echo "Use the AWS Terraform deployment path instead."
