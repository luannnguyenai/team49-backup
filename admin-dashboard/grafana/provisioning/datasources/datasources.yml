apiVersion: 1

datasources:
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: Postgres
    uid: Postgres
    type: postgres
    access: proxy
    url: host.docker.internal:5433
    user: postgres
    secureJsonData:
      password: change_me_strong_password
    jsonData:
      database: ai_learning
      sslmode: disable
      postgresVersion: 1600
    editable: true
